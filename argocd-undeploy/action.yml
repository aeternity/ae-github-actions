name: Undeploy
description: "Argocd Undeploy"
inputs:
  url-prefix:
    description: "PR Number"
    required: true
  env:
    description: "Environment"
    required: true
  app:
    description: "Application"
    required: true
  domain:
    description: "Domain"
    required: false
    default: "${DOMAIN}"
runs:
  using: "composite"
  steps:
    - id: undeploy
      run: |
        sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
        sudo chmod +x /usr/local/bin/yq
        export VERSION=${{ inputs.url-prefix }}
        
        if [ "${{ env.APP }}" == "hexpulse" ]; then
          export HOST=${{ inputs.url-prefix }}
        else
          export HOST=${{ inputs.url-prefix }}-${{ env.APP }}
        fi

        export DOMAIN=${{ inputs.domain }}

        yq eval -i 'del( .app.versions[] | select(.version == env(VERSION)) )' ${{ inputs.app }}/values-${{ inputs.env }}.yaml
        yq eval -i 'del( .app.ingress.hosts[] | select(.[] == "'${HOST}.${{ inputs.env }}.${DOMAIN}'"))' ${{ inputs.app }}/values-${{ inputs.env }}.yaml
        cat ${{ inputs.app }}/values-${{ inputs.env }}.yaml
        git config user.name "github-actions"
        git config user.email "aeternity-bot@users.noreply.github.com"
        git add .
        # A caller that races a still-in-flight deploy for the same version can
        # land here before that entry exists, so there is nothing to delete and
        # nothing to commit. That is not a failure of this action - treat it as
        # a no-op rather than letting `git commit` exit non-zero and fail the
        # step (which would also skip the caller's push, with no later event
        # left to retry either the commit or the push).
        git diff --cached --quiet && echo "Nothing to undeploy for ${VERSION}.${{ inputs.env }}.${DOMAIN}" || git commit -m "Undeploy ${VERSION}.${{ inputs.env }}.${DOMAIN}"
      shell: bash
